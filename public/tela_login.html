<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GordoSensores — Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
        <span class="navbar-brand fw-bold">
            <i class="bi bi-train-front-fill me-2 text-warning"></i>GordoSensores
        </span>
    </div>
</nav>

<div class="container-fluid py-4 px-3">

    <section id="screen-login" class="mb-5">

        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <i class="bi bi-train-front-fill display-4 text-warning"></i>
                            <h4 id="titulo" class="fw-bold mt-2">Login</h4>
                            <p class="text-muted small">Sistema de Monitoramento Ferroviário</p>
                        </div>

                        <form id="form-login">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="email" class="form-control" placeholder="usuario@empresa.com" />
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" id="senha" class="form-control" placeholder="••••••••" />
                                    <button type="button" class="btn btn-outline-secondary" onclick="toggleSenha()">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" />
                                <label class="form-check-label">Manter conectado</label>
                            </div>

                            <button id="button" class="btn btn-warning w-100 fw-bold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>

                        </form>

                        <p id="mensagem" class="text-center mt-3"></p>

                        <hr />

                        <p id="toggle" class="text-center text-primary" style="cursor: pointer;">
                            Não tem conta? Cadastre-se!
                        </p>

                    </div>
                </div>
            </div>
        </div>

    </section>

</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
